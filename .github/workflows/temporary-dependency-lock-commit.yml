name: Temporary dependency lockfile commit

on:
  pull_request:
    types: [opened, synchronize]
    branches: [main]

permissions:
  contents: write

jobs:
  lockfile:
    if: github.repository == 'evgenijgavris98-sys/vscode-shipit' && github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'security/fix-npm-dependencies'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Generate patched lockfile without lifecycle scripts
        run: |
          npm install --ignore-scripts
          npm audit fix --package-lock-only --ignore-scripts || true
          npm ci
      - name: Commit lockfile update to this branch only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          if git diff --cached --quiet; then
            echo "package-lock.json already matches the patched dependency graph"
            exit 0
          fi
          git commit -m "security(deps): update patched package lock"
          git push origin "HEAD:${{ github.head_ref }}"
