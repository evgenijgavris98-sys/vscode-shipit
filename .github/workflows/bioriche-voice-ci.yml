name: BIORICHE BRAIN Voice CI
# Final verification pass

permissions:
  contents: write

on:
  push:
    branches:
      - bioriche/voice-realtime
  workflow_dispatch:

jobs:
  compile-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm install
      - name: Persist regenerated lockfile
        run: |
          if ! git diff --quiet -- package-lock.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add package-lock.json
            git commit -m "chore(bioriche): synchronize npm lockfile"
            git push origin HEAD:bioriche/voice-realtime
          fi
      - run: npm run compile
      - run: npm run lint
      - run: xvfb-run -a npm test
