name: Brain CI

on:
  pull_request:
    paths:
      - "src/bioricheBrain/**"
      - "src/**"
      - "package.json"
      - "package-lock.json"
      - "tsconfig.json"
      - ".github/workflows/brain-ci.yml"
      - ".github/workflows/github-tech-radar.yml"
      - "scripts/github-tech-radar.mjs"

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm install --package-lock-only --ignore-scripts
      - run: npm ci
      - run: npm run compile
      - run: npm run lint
      - name: Validate GitHub Tech Radar scanner
        run: node --check scripts/github-tech-radar.mjs
      - run: xvfb-run -a npm test
