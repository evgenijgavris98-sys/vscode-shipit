name: Brain CI

on:
  pull_request:
    paths:
      - "src/bioricheBrain/**"
      - "src/**"
      - "package.json"
      - "package-lock.json"
      - "tsconfig.json"
      - ".github/workflows/brain-ci.yml"

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          repository: ${{ github.event.pull_request.head.repo.full_name }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm install --package-lock-only --ignore-scripts
      - name: One-time sync of npm lockfile on the BIORICHEBRAIN PR branch
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'security/deny-copilot-tools-by-default'
        run: |
          if git diff --quiet -- package-lock.json; then
            echo "package-lock.json is already synchronized"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add package-lock.json
            git commit -m "chore: synchronize npm lockfile"
            git push origin "HEAD:${GITHUB_HEAD_REF}"
          fi
      - run: npm ci
      - run: npm run compile
      - run: npm run lint
      - run: xvfb-run -a npm test
