services:
  biorichebrain:
    build:
      context: .
      dockerfile: Dockerfile.biorichebrain
    image: biorichebrain-headless:local
    restart: unless-stopped
    init: true
    environment:
      OPENAI_API_KEY: ${OPENAI_API_KEY:?Set OPENAI_API_KEY in the shell or .env}
      BIORICHEBRAIN_SERVICE_TOKEN: ${BIORICHEBRAIN_SERVICE_TOKEN:?Set a random token of at least 32 characters}
      BIORICHEBRAIN_HOST: 0.0.0.0
      BIORICHEBRAIN_PORT: 8787
      BIORICHEBRAIN_DATA_DIR: /var/lib/biorichebrain
      BIORICHEBRAIN_MAX_QUEUE: 100
    ports:
      - "127.0.0.1:8787:8787"
    volumes:
      - biorichebrain_data:/var/lib/biorichebrain
    read_only: true
    tmpfs:
      - /tmp:size=16m,noexec,nosuid
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8787/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  biorichebrain_data:
